name: Continuous Integration - E-commerce Microservices

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

# Este workflow valida el estado integrado del orquestador: los repositorios de los
# microservicios se traen como submódulos. Cada uno además tiene su propio ci.yml.
jobs:
  # -------------------------------------------------------------
  # Job 1: Pruebas del Backend A (Inventario - Node.js + Express)
  # -------------------------------------------------------------
  test-inventario:
    name: Test Inventario (Node.js)
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - name: Checkout repository (con submódulos)
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: inventario/package-lock.json

      - name: Install dependencies
        run: |
          cd inventario
          npm ci

      - name: Run Jest tests
        env:
          # Los tests borran colecciones: MONGO_URI_TEST debe ser distinta de MONGO_URI.
          MONGO_URI: mongodb://localhost:27017/inventario_db
          MONGO_URI_TEST: mongodb://localhost:27017/inventario_db_test
          JWT_SIGNING_KEY: test_jwt_signing_key
          SERVICE_TOKEN: test_service_token
        run: |
          cd inventario
          npm test

  # -------------------------------------------------------------
  # Job 2: Pruebas del Backend B (Pedidos - Python + Django)
  # -------------------------------------------------------------
  test-pedidos:
    name: Test Pedidos (Django)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: pedidos_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository (con submódulos)
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          # Django 6.1.3 exige Python >= 3.12.
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: pedidos/requirements.txt

      - name: Install dependencies
        run: |
          cd pedidos
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django unit tests
        env:
          # Sin DB_ENGINE=postgresql los tests usarían SQLite y el servicio quedaría sin uso.
          DB_ENGINE: postgresql
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: pedidos_db
          DB_USER: test_user
          DB_PASSWORD: test_password
          SECRET_KEY: test_secret_key_para_ci_sin_usar_en_produccion
          JWT_SIGNING_KEY: test_jwt_signing_key_para_ci
        run: |
          cd pedidos
          python manage.py test

  # -------------------------------------------------------------
  # Job 3: Pruebas del Backend C (Pagos - Python + FastAPI)
  # -------------------------------------------------------------
  test-pagos:
    name: Test Pagos (FastAPI)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository (con submódulos)
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: pagos/requirements.txt

      - name: Install dependencies
        run: |
          cd pagos
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest suite
        run: |
          cd pagos
          pytest
