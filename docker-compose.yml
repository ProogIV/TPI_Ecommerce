services:
  mongo:
    image: mongo:7
    container_name: tpi_mongo
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DB:-inventario_db}
    volumes:
      - mongo_data:/data/db
    networks:
      - tpi_network

  postgres:
    image: postgres:15-alpine
    container_name: tpi_postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pedidos_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - tpi_network

  redis:
    image: redis:7-alpine
    container_name: tpi_redis
    restart: always
    networks:
      - tpi_network

  inventario:
    build:
      context: ./inventario
      dockerfile: Dockerfile
    container_name: tpi_inventario
    restart: always
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      MONGO_URI: mongodb://mongo:27017/${MONGO_DB:-inventario_db}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:?Definí JWT_SIGNING_KEY en el .env de la raíz}
      SERVICE_TOKEN: ${SERVICE_TOKEN:?Definí SERVICE_TOKEN en el .env de la raíz}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080,http://localhost:5500,http://127.0.0.1:5500}
      PEDIDOS_API_URL: http://pedidos:8000/api
      # Carga un proveedor y productos de prueba si la base está vacía (planificación, punto 1.4)
      SEED_DATA: "true"
    depends_on:
      - mongo
    networks:
      - tpi_network

  pedidos:
    build:
      context: ./pedidos
      dockerfile: Dockerfile
    container_name: tpi_pedidos
    restart: always
    ports:
      - "8000:8000"
    environment:
      DEBUG: "False"
      # "pedidos" es el nombre con el que Inventario lo llama dentro de la red de Docker
      ALLOWED_HOSTS: "localhost,127.0.0.1,pedidos"
      SECRET_KEY: ${SECRET_KEY:?Definí SECRET_KEY en el .env de la raíz}
      DB_ENGINE: postgresql
      DB_NAME: ${POSTGRES_DB:-pedidos_db}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DB_HOST: postgres
      DB_PORT: "5432"
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:?Definí JWT_SIGNING_KEY en el .env de la raíz}
      SERVICE_TOKEN: ${SERVICE_TOKEN:?Definí SERVICE_TOKEN en el .env de la raíz}
      INVENTARIO_API_URL: http://inventario:3000/api
      PAGOS_API_URL: http://pagos:8001/api
      REDIS_URL: redis://redis:6379
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080,http://localhost:5500,http://127.0.0.1:5500}
      CSRF_TRUSTED_ORIGINS: http://localhost:8000,http://127.0.0.1:8000
      # Usuarios de demostración que crea "manage.py seed" (ver README)
      DEMO_ADMIN_USERNAME: ${DEMO_ADMIN_USERNAME:-admin}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-Admin12345!}
      DEMO_CLIENTE_USERNAME: ${DEMO_CLIENTE_USERNAME:-cliente}
      DEMO_CLIENTE_PASSWORD: ${DEMO_CLIENTE_PASSWORD:-Cliente12345!}
    # Espera a PostgreSQL, aplica migraciones, crea los usuarios de prueba y levanta el servidor ASGI.
    command: >
      sh -c "until python -c \"import socket; socket.create_connection(('postgres', 5432), 2)\" 2>/dev/null;
      do echo 'Esperando a PostgreSQL...'; sleep 1; done;
      python manage.py migrate --noinput &&
      python manage.py seed &&
      daphne -b 0.0.0.0 -p 8000 config.asgi:application"
    depends_on:
      - postgres
      - redis
      - inventario
      - pagos
    networks:
      - tpi_network

  pagos:
    build:
      context: ./pagos
      dockerfile: Dockerfile
    container_name: tpi_pagos
    restart: always
    ports:
      - "8001:8001"
    environment:
      PORT: 8001
      LIMITE_APROBACION: 10000000
    networks:
      - tpi_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tpi_frontend
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - inventario
      - pedidos
    networks:
      - tpi_network

networks:
  tpi_network:
    driver: bridge

volumes:
  mongo_data:
  postgres_data:
